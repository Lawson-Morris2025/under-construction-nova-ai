<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova AI — Coming Soon</title>
  <style>
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(50px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 10px #fff; }
      50% { text-shadow: 0 0 30px #4cc9f0; }
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #3a0ca3, #000);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    .coming-soon {
      font-size: 3rem;
      margin-bottom: 2rem;
      animation: fadeInUp 1s ease-out forwards, glow 2s infinite;
    }

    h1 {
      font-size: 5rem;
      margin-bottom: 0.5rem;
      line-height: 1.2;
      animation: fadeInUp 1s ease-out forwards, pulse 2s infinite;
    }

    .line-break {
      display: block;
      font-size: 2.5rem;
      margin: 0.3rem 0;
    }

    .btn {
      margin-top: 2rem;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      background-color: #4cc9f0;
      color: #000;
      text-decoration: none;
      border-radius: 12px;
      transition: 0.3s;
      font-weight: bold;
      animation: fadeInUp 2.5s ease-out forwards;
    }

    .btn:hover {
      background-color: #4895ef;
      transform: scale(1.05);
    }

    footer {
      position: absolute;
      bottom: 1rem;
      font-size: 0.8rem;
      opacity: 0.7;
      animation: fadeInUp 3s ease-out forwards;
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="coming-soon">Coming Soon</div>
  <h1>
    Nova AI<br>
    <span class="line-break">by</span>
    Nova AI Studios
  </h1>

  <a href="https://lawsonmorris.co.uk" class="btn">Other LawsonMorris.co.uk Projects</a>

  <footer>
    © 2025 Lawson Morris — Nova AI Studios. All Rights Reserved. Copyright owned by Lawson Morris.
  </footer>

  <script>
    function createConfetti() {
      const confetti = document.createElement('div');
      confetti.classList.add('confetti');
      confetti.style.left = Math.random() * window.innerWidth + 'px';
      confetti.style.top = '0px';
      confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
      const size = Math.random() * 12 + 6;
      confetti.style.width = confetti.style.height = size + 'px';
      confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
      document.body.appendChild(confetti);
      setTimeout(() => confetti.remove(), 5000);
    }

    function triggerConfetti() {
      for(let i = 0; i < 1000; i++) {
        setTimeout(createConfetti, i * 3);
      }
    }

    const title = document.querySelector('h1');
    title.addEventListener('animationstart', () => {
      triggerConfetti();
    });
  </script>
</body>
</html>
